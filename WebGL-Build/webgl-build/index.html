<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>SolMechs × Play Solana (PSG1)</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      body { 
        margin: 0; 
        padding: 0; 
        background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        background-attachment: fixed;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      
      .psg1-container {
        position: relative;
        width: 1240px;
        height: 1080px;
        background: url('OverlayPSG1.png') no-repeat center center;
        background-size: contain;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      .game-screen {
        width: 1040px; /* 1240 - 200px borders */
        height: 910px;  /* 1080 - 170px borders */
        background: #000;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        position: relative;
      }
      
      #unity-container {
        width: 100%;
        height: 100%;
        position: relative;
      }
      
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #231F20;
        border-radius: 10px;
      }
      
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
      }
      
      #unity-logo {
        width: 154px;
        height: 130px;
        background: url('unity-logo-dark.png') no-repeat center;
      }
      
      #unity-progress-bar-empty {
        width: 141px;
        height: 18px;
        margin-top: 10px;
        margin-left: 6.5px;
        background: url('progress-bar-empty-dark.png') no-repeat center;
      }
      
      #unity-progress-bar-full {
        width: 0%;
        height: 18px;
        background: url('progress-bar-full-dark.png') no-repeat center;
      }
      
      .psg1-header {
        position: absolute;
        top: -50px;
        left: 50%;
        transform: translateX(-50%);
        color: #00ffff;
        font-size: 24px;
        font-weight: bold;
        text-shadow: 0 0 10px #00ffff;
        z-index: 1000;
        white-space: nowrap;
      }
      
      .psg1-status {
        position: absolute;
        bottom: -40px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffffff;
        font-size: 14px;
        text-align: center;
        z-index: 1000;
      }
      
      .psg1-controls {
        position: absolute;
        right: -250px;
        top: 50%;
        transform: translateY(-50%);
        color: #ffffff;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 10px;
        border: 1px solid #00ffff;
        max-width: 200px;
      }
      
      .psg1-controls h3 {
        color: #00ffff;
        margin-top: 0;
        font-size: 14px;
        text-align: center;
      }
      
      .control-item {
        margin: 8px 0;
        display: flex;
        justify-content: space-between;
      }
      
      .control-key {
        background: #333;
        padding: 2px 8px;
        border-radius: 4px;
        color: #00ffff;
        font-weight: bold;
        min-width: 30px;
        text-align: center;
      }
      
      /* Responsive scaling */
      @media screen and (max-width: 1280px) {
        .psg1-container {
          transform: scale(0.8);
        }
        .psg1-controls {
          right: -200px;
        }
      }
      
      @media screen and (max-width: 1024px) {
        .psg1-container {
          transform: scale(0.6);
        }
        .psg1-controls {
          right: -150px;
          font-size: 10px;
        }
      }
      
      @media screen and (max-width: 768px) {
        .psg1-container {
          transform: scale(0.5);
        }
        .psg1-controls {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="psg1-container">
      <div class="psg1-header">
        🎮 SOLMECHS × PLAY SOLANA (PSG1)
      </div>
      
      <div class="game-screen">
        <div id="unity-container">
          <canvas id="unity-canvas" width=420 height=280></canvas>
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="psg1-status">
        🚀 Play Solana Gaming Platform | WebGL Build
      </div>
      
      <div class="psg1-controls">
        <h3>🕹️ PSG1 CONTROLS</h3>
        <div class="control-item">
          <span>Start Game</span>
          <span class="control-key">SPACE</span>
        </div>
        <div class="control-item">
          <span>Test PSG1</span>
          <span class="control-key">C</span>
        </div>
        <div class="control-item">
          <span>Wallet</span>
          <span class="control-key">W</span>
        </div>
        <div class="control-item">
          <span>Toggle View</span>
          <span class="control-key">ESC</span>
        </div>
        <div class="control-item">
          <span>Mint NFT</span>
          <span class="control-key">N</span>
        </div>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/webgl-build.loader.js";
      var config = {
        dataUrl: buildUrl + "/webgl-build.data",
        frameworkUrl: buildUrl + "/webgl-build.framework.js",
        codeUrl: buildUrl + "/webgl-build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "SolMechs",
        productName: "SolMechs-TestVersion",
        productVersion: "1.0",
      };

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          
          console.log("🎮 PSG1 WebGL Game loaded successfully!");
          console.log("🌐 PSG1 Template active - SolMechs × Play Solana");
          
          // Make Unity instance globally available
          window.unityInstance = unityInstance;
          
          // PSG1 JavaScript Functions for Unity WebGL
          window.GetWalletAddress = function() {
            console.log("🔗 PSG1 Template: Unity requesting wallet address");
            if (window.parent && window.parent.web3Bridge && window.parent.web3Bridge.getWalletAddress) {
              const wallet = window.parent.web3Bridge.getWalletAddress();
              console.log(`🔗 PSG1 Template returning wallet: ${wallet}`);
              return wallet;
            }
            console.log("🔗 PSG1 Template returning demo wallet");
            return "PSG1_DEMO_WALLET";
          };
          
          window.GetUserBalance = function() {
            console.log("💰 PSG1 Template: Unity requesting user balance");
            if (window.parent && window.parent.web3Bridge && window.parent.web3Bridge.getBalance) {
              console.log("💰 PSG1 Template returning balance: 2000");
              return "2000";
            }
            console.log("💰 PSG1 Template returning demo balance");
            return "1000";
          };
          
          window.LogToJS = function(message) {
            console.log("🎮 PSG1 TEMPLATE MESSAGE:", message);
            
            // Update page title based on PSG1 state
            if (message === "PSG1_SCREEN_ACTIVE") {
              document.title = "SolMechs × Play Solana (PSG1) - PSG1 Mode";
            } else if (message === "SOLMECHS_GAME_ACTIVE") {
              document.title = "SolMechs × Play Solana (PSG1) - Game Mode";
            }
            
            // Handle NFT mint requests
            if (message.startsWith("NFT_MINT_REQUEST:")) {
              const nftData = message.replace("NFT_MINT_REQUEST:", "");
              console.log("🎨 PSG1 Template NFT Mint:", nftData);
              
              if (window.parent && window.parent.web3Bridge && window.parent.web3Bridge.handleNFTMintRequest) {
                window.parent.web3Bridge.handleNFTMintRequest(nftData);
              } else {
                alert(`🎨 PSG1 × SolMechs NFT!\n\nMinting via Play Solana:\n${nftData}`);
              }
            }
          };
          
          console.log("✅ PSG1 Template: All bridge functions ready!");
          
          // Update status
          document.querySelector('.psg1-status').innerHTML = 
            '✅ Play Solana Gaming Platform | PSG1 Ready | WebGL Active';
            
        }).catch((message) => {
          alert("PSG1 WebGL Load Error: " + message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
